services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wensenlijstje
      POSTGRES_PASSWORD: wensenlijstje
      POSTGRES_DB: wensenlijstje
    ports:
      - "5432:5432"
    volumes:
      - wensenlijstje_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wensenlijstje -d wensenlijstje"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  wensenlijstje_pg:
